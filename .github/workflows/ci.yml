name: Pruebas

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
        env:
          RESEND_API_KEY: ci
          CONTACT_TO: ci@example.com
          CONTACT_FROM: Kinetika <ci@example.com>
      - run: yarn test
      - run: npx playwright install --with-deps chromium-headless-shell
      - run: yarn build
        env:
          # Placeholders: the build only needs them to exist
          RESEND_API_KEY: ci
          CONTACT_TO: ci@example.com
          CONTACT_FROM: Kinetika <ci@example.com>
      - run: yarn test:e2e
      - run: yarn test:a11y
      # The portfolio cards must show the current demos
      - run: yarn check:captures
      # Performance budget: LCP, CLS, TBT and full accessibility/SEO scores
      - run: yarn test:perf
